name: Health Check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check API health
        id: api
        run: |
          HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 \
            https://bugsnap-xgfd.onrender.com/health || echo "000")
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT

          if [ "$HTTP_CODE" != "200" ]; then
            echo "api_ok=false" >> $GITHUB_OUTPUT
            echo "API returned HTTP $HTTP_CODE"
          else
            DB_STATUS=$(cat /tmp/health.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('database','unknown'))" 2>/dev/null || echo "unknown")
            echo "db_status=$DB_STATUS" >> $GITHUB_OUTPUT
            if [ "$DB_STATUS" != "connected" ]; then
              echo "api_ok=false" >> $GITHUB_OUTPUT
              echo "Database status: $DB_STATUS"
            else
              echo "api_ok=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Check web frontend
        id: web
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            https://bugsnap-web-dun.vercel.app || echo "000")
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" = "200" ]; then
            echo "web_ok=true" >> $GITHUB_OUTPUT
          else
            echo "web_ok=false" >> $GITHUB_OUTPUT
            echo "Web returned HTTP $HTTP_CODE"
          fi

      - name: Report failure
        if: steps.api.outputs.api_ok == 'false' || steps.web.outputs.web_ok == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const apiOk = '${{ steps.api.outputs.api_ok }}' === 'true';
            const webOk = '${{ steps.web.outputs.web_ok }}' === 'true';
            const apiCode = '${{ steps.api.outputs.http_code }}';
            const webCode = '${{ steps.web.outputs.http_code }}';
            const dbStatus = '${{ steps.api.outputs.db_status }}' || 'N/A';

            const failures = [];
            if (!apiOk) failures.push(`API (HTTP ${apiCode}, DB: ${dbStatus})`);
            if (!webOk) failures.push(`Web (HTTP ${webCode})`);

            const title = `Health Check Failed: ${failures.join(', ')}`;
            const body = [
              `## Health Check Failure`,
              ``,
              `**Time:** ${new Date().toISOString()}`,
              ``,
              `| Service | Status | HTTP Code |`,
              `|---------|--------|-----------|`,
              `| API     | ${apiOk ? 'OK' : 'FAIL'} | ${apiCode} |`,
              `| Web     | ${webOk ? 'OK' : 'FAIL'} | ${webCode} |`,
              `| Database | ${dbStatus} | - |`,
              ``,
              `**API URL:** https://bugsnap-xgfd.onrender.com/health`,
              `**Web URL:** https://bugsnap-web-dun.vercel.app`,
            ].join('\n');

            // Check for existing open health-check issue to avoid duplicates
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'health-check',
              state: 'open',
              per_page: 1,
            });

            if (existingIssues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssues[0].number,
                body: body,
              });
              console.log(`Commented on existing issue #${existingIssues[0].number}`);
            } else {
              const { data: newIssue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['health-check'],
              });
              console.log(`Created issue #${newIssue.number}`);
            }
