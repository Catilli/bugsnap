<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BugSnap</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: white;
    }

    .popup-container {
      padding: 24px;
    }

    .section-label {
      font-size: 11px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .project-name {
      font-size: 24px;
      font-weight: 400;
      color: #1e40af;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .view-btn {
      width: 100%;
      padding: 12px 20px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 16px;
    }

    .view-btn:hover {
      background: #2563eb;
    }

    .logged-in-text {
      font-size: 13px;
      color: #6b7280;
    }

    .no-project-heading {
      font-size: 20px;
      font-weight: 400;
      color: #111827;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .no-project-text {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .login-text {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .btn-link {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
    }

    .btn-link:hover {
      text-decoration: underline;
    }

    .reload-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #3b82f6;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .reload-link:hover {
      text-decoration: underline;
    }

    .reload-icon {
      width: 14px;
      height: 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <!-- Not Authenticated View -->
    <div id="notAuthView" class="hidden">
      <p class="login-text">
        Please <a href="http://localhost:3000/login" target="_blank" class="btn-link">login to BugSnap</a> to start using the extension.
      </p>
    </div>

    <!-- Authenticated View - With Project -->
    <div id="projectView" class="hidden">
      <a href="#" id="reloadLink" class="reload-link">
        <svg class="reload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Reload
      </a>
      <div class="section-label">Current Project</div>
      <div class="project-name" id="projectName"></div>
      <button id="viewProjectBtn" class="view-btn">View on BugSnap</button>
      <div class="logged-in-text">Logged in as <span id="userEmail"></span></div>
    </div>

    <!-- Authenticated View - No Project -->
    <div id="noProjectView" class="hidden">
      <h2 class="no-project-heading">No Project for this URL</h2>
      <p class="no-project-text">
        A project matching this URL couldn't be found in your BugSnap account.
      </p>
    </div>

    <!-- Loading View -->
    <div id="loadingView">
      <div class="login-text">Loading...</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
