<!DOCTYPE html>
<html>
<head>
  <title>BugSnap</title>
  <style>
    body {
      width: 320px;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      margin: 0;
    }
    .container {
      padding: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .project-label {
      font-size: 12px;
      color: #666;
      font-weight: 500;
    }
    .reload-btn {
      background: none;
      border: none;
      color: #4f46e5;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .reload-btn:hover {
      background-color: #f3f4f6;
    }
    .project-name {
      font-size: 20px;
      font-weight: bold;
      color: #111827;
      margin-bottom: 16px;
    }
    button.primary {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background-color: #4f46e5;
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 12px;
    }
    button.primary:hover {
      background-color: #4338ca;
    }
    .user-info {
      font-size: 11px;
      color: #6b7280;
      text-align: left;
    }
    .inactive {
      text-align: center;
      padding: 32px 16px;
    }
    .inactive-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .inactive-status {
      color: #6b7280;
      margin-bottom: 16px;
    }
    .loading {
      text-align: center;
      padding: 32px 16px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">Loading...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
