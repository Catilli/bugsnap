services:
  - type: web
    name: bugsnap-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false  # Must be set manually in dashboard (contains secrets)
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        value: https://bugsnap-web-dun.vercel.app
    healthCheckPath: /health
