services:
  - type: web
    name: bugsnap-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false  # Must be set manually in dashboard (contains secrets)
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        value: https://bugsnap-web-dun.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://bugsnap-web-dun.vercel.app
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: API_URL
        value: https://bugsnap-xgfd.onrender.com
      - key: REDIS_URL
        sync: false
      - key: HEALTH_ALERT_EMAIL
        sync: false
      - key: HEALTH_ALERT_WEBHOOK_URL
        sync: false
    healthCheckPath: /health
